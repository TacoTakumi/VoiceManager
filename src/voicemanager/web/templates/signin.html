{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Sign in</h1>
{% if no_users %}
<p class="page-sub">{{ no_users }}</p>
{% else %}
<p class="page-sub">Sign in to manage your API tokens and account.</p>
{% endif %}
<div class="box signin">
{% if error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}
<form method="post" action="/signin">
<input type="hidden" name="next" value="{{ next }}">
{% for field, value in hidden.items() %}
<input type="hidden" name="{{ field }}" value="{{ value }}">
{% endfor %}
<label>User name
<input type="text" name="name" autocomplete="username" autocapitalize="none" spellcheck="false" required>
</label>
<label>Password
<input type="password" name="password" autocomplete="current-password" required>
</label>
<button class="btn-accent" type="submit">Sign in</button>
</form>
</div>
{% endblock %}
